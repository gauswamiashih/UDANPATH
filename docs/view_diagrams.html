<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UdanPath — System Analysis & Design Diagram Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-base: #070a13;
            --bg-surface: #0d121f;
            --bg-card: rgba(17, 24, 39, 0.75);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-glow: rgba(59, 130, 246, 0.2);
            --accent: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --sidebar-w: 360px;
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.9);
            --border-card: rgba(0, 0, 0, 0.1);
            --border-focus: rgba(59, 130, 246, 0.6);
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-dim: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(37, 99, 235, 0.15);
            --accent: #7c3aed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.07) 0%, transparent 40%);
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-w);
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-card);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            z-index: 20;
            backdrop-filter: blur(16px);
        }

        .brand-header {
            padding: 22px 24px;
            border-bottom: 1px solid var(--border-card);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.6) 100%);
        }

        .brand-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-header p {
            font-size: 0.72rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
            font-weight: 600;
        }

        .search-box {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-card);
        }

        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: rgba(255, 255, 255, 0.06);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-dim);
            pointer-events: none;
            font-size: 0.85rem;
        }

        .category-filter {
            padding: 10px 18px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-card);
            scrollbar-width: none;
        }

        .category-filter::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-card);
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-chip:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .cat-chip.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .diagram-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding: 12px 14px;
        }

        .diagram-list::-webkit-scrollbar {
            width: 5px;
        }

        .diagram-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
        }

        .diagram-item {
            padding: 10px 14px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.86rem;
            color: var(--text-muted);
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .diagram-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
        }

        .diagram-item.active {
            background: var(--primary-glow);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.4);
            font-weight: 600;
        }

        .badge-chip {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            letter-spacing: 0.5px;
            min-width: 38px;
            text-align: center;
        }

        .diagram-item.active .badge-chip {
            background: var(--primary);
            color: #ffffff;
        }

        .diagram-item-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }

        /* Main Viewport */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .top-navbar {
            padding: 16px 32px;
            border-bottom: 1px solid var(--border-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .active-diag-meta h2 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .diag-category-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border-card);
        }

        .toggle-btn {
            padding: 6px 12px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .action-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .action-btn.primary:hover {
            background: var(--primary-hover);
        }

        .theme-toggle {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Viewport Canvas */
        .workspace-body {
            flex-grow: 1;
            padding: 24px 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Metadata Details Card */
        .meta-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 20px 24px;
            backdrop-filter: blur(12px);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .meta-col h3 {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #60a5fa;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-col p {
            font-size: 0.86rem;
            color: var(--text-muted);
            line-height: 1.55;
        }

        .meta-col ul {
            padding-left: 18px;
            font-size: 0.84rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .meta-col li {
            margin-bottom: 4px;
        }

        /* Diagram Canvas Area */
        .canvas-container {
            flex-grow: 1;
            min-height: 540px;
            background: #090d16;
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] .canvas-container {
            background: #f1f5f9;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.05);
        }

        /* Canvas Floating Controls */
        .canvas-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            backdrop-filter: blur(8px);
            z-index: 5;
        }

        .ctrl-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: var(--primary);
        }

        /* Source Code Container */
        .source-container {
            display: none;
            flex-grow: 1;
            background: #07090e;
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #34d399;
            overflow: auto;
            position: relative;
            white-space: pre;
            line-height: 1.5;
        }

        .copy-code-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-card);
            border-radius: 6px;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-code-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.8s linear infinite;
            display: none;
            position: absolute;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Print Media Styling */
        @media print {
            body {
                background: white !important;
                color: black !important;
                height: auto !important;
                overflow: visible !important;
                display: block !important;
            }
            .sidebar, .top-navbar, .canvas-controls, .copy-code-btn, .theme-toggle, .view-toggle, .action-btn {
                display: none !important;
            }
            .main-content {
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
            }
            .workspace-body {
                padding: 0 !important;
            }
            .canvas-container {
                background: white !important;
                border: 1px solid #ccc !important;
                min-height: 800px !important;
                box-shadow: none !important;
                page-break-inside: avoid;
            }
            .meta-card {
                background: #f8fafc !important;
                border: 1px solid #ccc !important;
                color: black !important;
                box-shadow: none !important;
                margin-bottom: 20px !important;
            }
            .meta-col h3 {
                color: #1e3a8a !important;
            }
            .meta-col p, .meta-col li {
                color: #333 !important;
            }
        }
    </style>
</head>

        </section>
    </main>

ist~String~ criteriaMet\n    +List~String~ criteriaFailed\n  }\n\n  class MatchmakingEngine {\n    +calculateFitScore(profile, exam, eligibility) Float\n    -computeInterestScore(preferences, category) Float\n    -computeCareerGoalScore(goals, exam) Float\n    -computePreferenceWeights(profile) Float\n  }\n\n  class VerificationEngine {\n    +queueDiscrepancy(examId, field, proposedVal) UUID\n    +approveChange(queueId, reviewerId) Boolean\n    +rejectChange(queueId, reason) Boolean\n  }\n\n  %% Relationships\n  StudentProfile \"1\" *-- \"1..*\" UserEducation : contains\n  Exam \"1\" *-- \"1..*\" ExamPaper : composed of\n  ExamPaper \"1\" *-- \"1..*\" ExamSubject : contains\n  ExamSubject \"1\" *-- \"1..*\" ExamTopic : details\n  Exam \"1\" *-- \"1\" ExamDate : scheduled by\n  Exam \"1\" *-- \"0..*\" ExamEligibilityRule : restricted by\n  \n  EligibilityEngine ..> StudentProfile : inspects\n  EligibilityEngine ..> Exam : evaluates\n  EligibilityEngine ..> EligibilityResult : generates\n  MatchmakingEngine ..> EligibilityResult : consumes\n  VerificationEngine ..> ExamDate : updates"

        // Format bullets helper
        function formatBullets(text) {
            if (!text) return '<p>N/A</p>';
            let lines = text.split('\n');
            let html = '';
            let inList = false;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('•') || line.startsWith('-') || line.startsWith('*')) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    let itemText = line.replace(/^[•\-*]\s*/, '');
                    itemText = itemText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    html += `<li>${itemText}</li>`;
                } else if (line) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    let pText = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    html += `<p style="margin-bottom:6px;">${pText}</p>`;
                }
            }
            if (inList) html += '</ul>';
            return html || '<p>N/A</p>';
        }

        // Populate Sidebar
        function renderSidebar() {
            listContainer.innerHTML = '';
            const filtered = DIAGRAMS_DB.filter((diag, index) => {
                const matchesCat = (currentFilter === 'ALL' || diag.category === currentFilter);
                const matchesQuery = (!searchQuery || 
                    diag.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    diag.purpose.toLowerCase().includes(searchQuery.toLowerCase())
                );
                return matchesCat && matchesQuery;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `<li style="padding:20px; text-align:center; color:var(--text-dim); font-size:0.85rem;">No matching diagrams found</li>`;
                return;
            }

            filtered.forEach((diag) => {
                const originalIndex = DIAGRAMS_DB.findIndex(d => d.id === diag.id);
                const li = document.createElement('li');
                li.className = `diagram-item ${originalIndex === activeIdx ? 'active' : ''}`;
                li.innerHTML = `
                    <span class="badge-chip">${diag.badge || '#' + diag.number}</span>
                    <span class="diagram-item-title">${diag.title}</span>
                `;
                li.addEventListener('click', () => switchDiagram(originalIndex));
                listContainer.appendChild(li);
            });
        }

            } catch (err) {
                console.error("Mermaid Render Failure: ", err);
                canvasLoader.style.display = 'none';
                diagramRender.innerHTML = `
                    <div style="padding: 24px; text-align: center; color: #ef4444; border: 1px dashed rgba(239, 68, 68, 0.4); border-radius: 8px; background: rgba(239, 68, 68, 0.05);">
                        <p style="font-weight: 700; margin-bottom: 6px;">Rendering Error in ${diag.title}</p>
                        <p style="font-size: 0.82rem; font-family: monospace; opacity: 0.85;">${err.message || err}</p>
                    </div>
                `;
            }
        }

        // Switch View Tab (Visual vs Source)
        function switchTab(tab) {
            activeTab = tab;
            if (tab === 'visual') {
                btnViewVisual.classList.add('active');
                btnViewSource.classList.remove('active');
                canvasContainer.style.display = 'flex';
                sourceContainer.style.display = 'none';
            } else {
                btnViewVisual.classList.remove('active');
                btnViewSource.classList.add('active');
                canvasContainer.style.display = 'none';
                sourceContainer.style.display = 'block';
            }
        }

        // Export as SVG
        function exportSvg() {
            const svgElem = diagramRender.querySelector('svg');
            if (!svgElem) return alert('No diagram rendered to export.');
            
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svgElem);
            if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            
            const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${DIAGRAMS_DB[activeIdx].id}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Export as PNG
        function exportPng() {
            const svgElem = diagramRender.querySelector('svg');
            if (!svgElem) return alert('No diagram rendered to export.');

            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgElem);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const URLObj = window.URL || window.webkitURL || window;
            const blobURL = URLObj.createObjectURL(svgBlob);

            const image = new Image();
            image.onload = () => {
                const bbox = svgElem.getBBox();
                const canvas = document.createElement('canvas');
                const scale = 2; // High-DPI scale
                canvas.width = Math.max(bbox.width * scale, 1200);
                canvas.height = Math.max(bbox.height * scale, 800);
                const ctx = canvas.getContext('2d');

                // Fill background
                const isDark = document.body.getAttribute('data-theme') !== 'light';
                ctx.fillStyle = isDark ? '#090d16' : '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
                const pngURL = canvas.toDataURL('image/png');

                const a = document.createElement('a');
                a.href = pngURL;
                a.download = `${DIAGRAMS_DB[activeIdx].id}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URLObj.revokeObjectURL(blobURL);
            };
            image.src = blobURL;
        }

        // Export as PDF
        function exportPdf() {
            const svgElem = diagramRender.querySelector('svg');
            if (!svgElem) return alert('No diagram rendered to export.');

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
                orientation: 'landscape',
                unit: 'pt',
                format: 'a4'
            });

            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgElem);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const blobURL = URL.createObjectURL(svgBlob);

            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width * 2;
                canvas.height = img.height * 2;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const dataURL = canvas.toDataURL('image/png');

                // A4 landscape dimensions: 842 x 595 pt
                doc.setFontSize(14);
                doc.text(DIAGRAMS_DB[activeIdx].title, 40, 40);
                doc.setFontSize(9);
                doc.text("Project: UdanPath — Architecture & Engineering Specification", 40, 56);

                doc.addImage(dataURL, 'PNG', 40, 70, 762, 480);
                doc.save(`${DIAGRAMS_DB[activeIdx].id}.pdf`);
                URL.revokeObjectURL(blobURL);
            };
            img.src = blobURL;
        }

        // Canvas Zoom Controls
        document.getElementById('ctrl-zoom-in').addEventListener('click', () => {
            if (panZoomInstance) panZoomInstance.zoomIn();
        });

        document.getElementById('ctrl-zoom-out').addEventListener('click', () => {
            if (panZoomInstance) panZoomInstance.zoomOut();
        });

        document.getElementById('ctrl-reset').addEventListener('click', () => {
            if (panZoomInstance) {
                panZoomInstance.reset();
                panZoomInstance.fit();
                panZoomInstance.center();
            }
        });

        document.getElementById('ctrl-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                canvasContainer.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        });

        // Copy Mermaid Code
        btnCopyCode.addEventListener('click', () => {
            navigator.clipboard.writeText(DIAGRAMS_DB[activeIdx].mermaid);
            btnCopyCode.textContent = '✓ Copied!';
            setTimeout(() => {
                btnCopyCode.textContent = 'Copy Mermaid Code';
            }, 2000);
        });

        // Tab events
        btnViewVisual.addEventListener('click', () => switchTab('visual'));
        btnViewSource.addEventListener('click', () => switchTab('source'));

        // Export & Print events
        btnExportSvg.addEventListener('click', exportSvg);
        btnExportPng.addEventListener('click', exportPng);
        btnExportPdf.addEventListener('click', exportPdf);
        btnPrint.addEventListener('click', () => window.print());

        // Theme Toggle
        btnThemeToggle.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            btnThemeToggle.textContent = newTheme === 'light' ? '☀️' : '🌙';
            
            // Re-render Mermaid with updated theme
            window.mermaid.initialize({
                startOnLoad: false,
                theme: newTheme === 'light' ? 'neutral' : 'dark'
            });
            switchDiagram(activeIdx);
        });

        // Category Filter Chips
        categoryFilterContainer.querySelectorAll('.cat-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                categoryFilterContainer.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.getAttribute('data-cat');
                renderSidebar();
            });
        });

        // Search Input
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderSidebar();
        });

        // Initial Start
        renderSidebar();
        switchDiagram(0);
    </script>
</body>
</html>
